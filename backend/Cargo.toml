[package]
name = "talium"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "net"] }
axum = { version = "0.8.6", features = ["ws"] }
sqlx = { version = "0.8.6", features = ["mysql", "chrono", "runtime-tokio"] }
anyhow = "1.0.100"
serde = "1.0.228"
serde_json = "1.0.145"

tower-http = { version = "0.6.6", features = ["fs", "cors", "redirect"] }
tower-service = "0.3.3"

url = "2.5.7"
rand = "0.9.2"
reqwest = "0.12.24"
regex = "1.12.2"
num-derive = "0.4.2"
num-traits = "0.2.19"
