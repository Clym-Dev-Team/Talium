[package]
name = "talium"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "net"] }
axum = { version = "0.8.6", features = ["ws"] }
tokio-tungstenite = "0.28.0"
url = "2.5.7"
rand = "0.9.2"
serde = "1.0.228"
sqlx = { version = "0.8.6", features = ["mysql", "chrono", "runtime-tokio"] }
anyhow = "1.0.100"
reqwest = "0.12.24"
serde_json = "1.0.145"
regex = "1.12.2"
num-derive = "0.4.2"
num-traits = "0.2.19"
tower-http = { version = "0.6.6", features = ["fs", "cors", "redirect"] }
axum-proxy = { version = "0.6.0", features = ["axum"] }
http = "1.3.1"
futures-util = "0.3.31"
tower-service = "0.3.3"
